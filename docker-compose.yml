# Fiecare serviciu are imaginea lui, construita din Dockerfile-ul propriu.
#
# Comenzi:
#   docker compose up -d --build broker   # porneste broker-ul in fundal
#   docker compose run --rm sender        # sender interactiv (meniu)
#   docker compose run --rm receiver --name ion --subscribe Anunt,Alerta
#                                         # receiver interactiv; poti rula mai multe, in terminale diferite
#   docker compose logs -f broker         # loguri broker
#   docker compose down                   # opreste tot

services:
  broker:
    build:
      # Contextul este radacina repo-ului, pentru ca broker-ul foloseste si src/common.
      context: .
      dockerfile: src/broker/Dockerfile
    image: pad-broker
    ports:
      - "4242:4242"
    volumes:
      # Logurile (inclusiv deadletter.log) raman pe calculator.
      - ./logs:/app/logs

  sender:
    build:
      context: .
      dockerfile: src/sender/Dockerfile
    image: pad-sender
    environment:
      # In reteaua Docker, broker-ul se gaseste dupa numele serviciului.
      PAD_BROKER_HOST: broker
    depends_on:
      - broker
    # Sender-ul are meniu: are nevoie de STDIN deschis si de terminal.
    stdin_open: true
    tty: true
    # Nu porneste la "docker compose up"; il pornesti cand vrei sa trimiti ceva.
    profiles:
      - interactiv
    volumes:
      - ./logs:/app/logs

  receiver:
    build:
      context: .
      dockerfile: src/receivers/Dockerfile
    image: pad-receiver
    environment:
      PAD_BROKER_HOST: broker
    depends_on:
      - broker
    stdin_open: true
    tty: true
    profiles:
      - interactiv
    volumes:
      - ./logs:/app/logs